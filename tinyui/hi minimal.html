<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hi minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one 76-character column. Header is plain text. Everything is mono, hairlines only. */
  --bg:#FAFAFA; --surface:#FAFAFA; --ink:#111111; --dim:#6A6A6A; --line:#DCDCDC;
  --accent:#111111; --accent-ink:#FAFAFA; --accent-text:#111111;
  --ok:#1E7A45; --err:#C0281C;
  --display:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --body:var(--display); --mono:var(--display);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--surface:#0B0B0B;--ink:#E8E8E8;--dim:#8E8E8E;--line:#2A2A2A;--accent:#E8E8E8;--accent-ink:#0B0B0B;--accent-text:#E8E8E8;--ok:#55D68F;--err:#FF7A66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0B;--surface:#0B0B0B;--ink:#E8E8E8;--dim:#8E8E8E;--line:#2A2A2A;--accent:#E8E8E8;--accent-ink:#0B0B0B;--accent-text:#E8E8E8;--ok:#55D68F;--err:#FF7A66;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13.5px/1.65 var(--mono);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:disabled{cursor:not-allowed;opacity:.4}
pre{margin:0;font:400 12.5px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
h1,h2,h3,p{margin:0;font-weight:400}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:none}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* shell: header row + stage */
#app{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100%;position:relative}
.rail{display:flex;align-items:baseline;gap:6px 22px;flex-wrap:wrap;padding:14px max(20px,calc((100vw - 100ch)/2)) 12px;border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:14px}
.logo i{font-style:normal}
.sys{display:flex;gap:7px;align-items:baseline;color:var(--dim);font-size:12px}
.sys .dot{display:none}
.sys::before{content:"●";color:var(--ok);font-size:9px;position:relative;top:-1px}
.sys.busy::before{content:"▌";color:var(--ink);font-size:12px;top:1px;animation:blink 1s steps(1) infinite}
.sys.err::before{color:var(--err)}
.nav{display:flex;gap:2px 16px;flex-wrap:wrap}
.nav button{color:var(--dim);text-transform:lowercase;padding:0;min-height:28px;display:inline-flex;align-items:center;gap:4px}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.nav .count{color:var(--dim)}.nav .count::before{content:"("}.nav .count::after{content:")"}
.rail-foot{margin-left:auto;display:flex;align-items:baseline;gap:16px;color:var(--dim);font-size:12px}
.rail-foot .model{display:none}
.theme-btn{color:var(--dim);min-height:28px}.theme-btn:hover{color:var(--ink);text-decoration:underline}
.theme-btn::before{content:"theme:"}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{flex:none;display:flex;align-items:baseline;gap:8px 24px;flex-wrap:wrap;padding:14px max(20px,calc((100vw - 100ch)/2)) 12px}
.top h1{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.top .sub{color:var(--dim);font-size:12px;margin-left:12px}
.top .grow{flex:1}
.top .titles{min-width:0}

/* route strip: text only */
.strip{display:flex;gap:0;margin:0;padding:0;list-style:none;font-size:12px;color:var(--dim)}
.strip li+li::before{content:"›";margin:0 8px;color:var(--line)}
.strip li::before{background:none}
.strip li.past{color:var(--ink)}
.strip li.now{color:var(--ink);font-weight:600}
.strip li.now::after{content:"▌";animation:blink 1s steps(1) infinite}

/* buttons are text */
.btn{display:inline-flex;align-items:center;min-height:36px;padding:0;color:var(--ink)}
.btn::before{content:"[ ";color:var(--dim)}.btn::after{content:" ]";color:var(--dim)}
.btn:hover:not(:disabled){text-decoration:underline;text-underline-offset:4px}
.btn.primary{font-weight:600}
.btn.danger{color:var(--err)}
.btn.quiet,.btn.sm{font-size:12.5px}
.btn.quiet{color:var(--dim)}.btn.quiet:hover:not(:disabled){color:var(--ink)}
.lbl{color:var(--dim);font-size:12px;text-transform:lowercase}
.lbl::after{content:":"}

/* chat */
.feed{flex:1 1 0;min-height:0;overflow-y:auto;scrollbar-width:thin}
.lane{max-width:calc(100ch + 40px);margin:0 auto;padding:0 20px}
.feed .lane{padding-top:18px;padding-bottom:20px;display:flex;flex-direction:column;gap:28px}
.hero{padding:6vh 0 0;display:flex;flex-direction:column;gap:10px}
.hero .big{display:none}
.hero p{color:var(--dim);max-width:60ch}.hero p b{color:var(--ink);font-weight:600}
.turn.fresh{animation:fade .3s both}
.who{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:6px}
.who .tag{color:var(--ink);padding:0;border:0;font-weight:600}
.say{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.say::before{content:"> ";color:var(--dim);font-weight:400}
.reply{white-space:pre-line;max-width:68ch;margin-top:10px}
.trace{list-style:none;margin:0;padding:0}
.step{position:relative;padding-left:2.5ch}
.node{position:absolute;left:0;top:7px;width:auto;height:auto;background:none;line-height:1.4;color:var(--dim);font-size:12px}
.node::before{content:"+"}
.step.running .node::before{content:"~";color:var(--ink);animation:blink 1s steps(1) infinite}
.step.skipped .node::before{content:"-"}
.stephead{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main scope" "sum sum";gap:0 14px;padding:5px 0;min-height:36px;align-items:baseline}
.stephead::before{content:"▸";position:absolute;left:-1.6ch;color:var(--dim);display:none}
.stephead:hover .st-title{text-decoration:underline;text-underline-offset:3px}
.st-main{grid-area:main;display:flex;gap:10px;flex-wrap:wrap}
.st-title{font-weight:600}.st-tool{color:var(--dim);font-size:12px}
.st-sum{grid-area:sum;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope{grid-area:scope;color:var(--dim);font-size:11.5px;text-transform:lowercase;border:0;padding:0}
.scope::before{content:"("}.scope::after{content:")"}
.scope.strong{background:none;color:var(--ink);font-weight:600}
.chev{display:none}
.stephead::after{content:"+";position:absolute;right:0;top:5px;color:var(--dim);font-size:12px;display:none}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s}
.step.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden;min-height:0}
.detail .inner{display:flex;flex-direction:column;gap:6px;padding:6px 0 14px}
.tape{border:0;border-left:1px solid var(--line);padding:2px 0 2px 14px;background:none}
.tape.result{border-left-color:var(--ink)}
.fig{margin:14px 0 0;border:0;width:420px;max-width:100%;transition:width .3s}
.fig.wide{width:100%}
.fig>svg{display:block;width:100%;height:auto}
.fig figcaption{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:4px 0;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
.fig figcaption div{display:flex;gap:14px}
.ax{font:400 11px var(--mono);fill:var(--dim)}.eq{font:600 12px var(--mono);fill:var(--accent-ink)}
.file{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:14px;padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-width:68ch}
.file .meta{flex:1;display:flex;flex-direction:column;min-width:0}.file .meta b{font-weight:600;overflow-wrap:anywhere}.file .meta span{color:var(--dim);font-size:12px}
.quotes{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.quote{margin:0;padding-left:14px;border-left:1px solid var(--ink)}
.quote .path{color:var(--dim);font-size:12px}
.quote p{margin-top:2px;max-width:66ch}
.gate{display:flex;align-items:baseline;gap:6px 20px;flex-wrap:wrap;padding:10px 0;margin-bottom:6px;border-top:1px solid var(--err);border-bottom:1px solid var(--err);color:var(--err)}
.gate .ic{display:none}
.gate .msg{flex:1 1 220px;display:flex;gap:10px;flex-wrap:wrap;background:none;padding:0;margin:0}
.gate .msg b{font-weight:600}.gate .msg span{color:var(--ink)}
.gate kbd{opacity:.7;font:inherit;margin-left:4px}
.dock{flex:none;padding-bottom:14px;background:var(--bg)}
.tries{display:flex;gap:4px 16px;align-items:baseline;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;color:var(--dim);font-size:12px}
.tries::-webkit-scrollbar{display:none}
.tries .lbl{flex:none}
.chip{flex:none;color:var(--dim);min-height:28px;border:0;padding:0;font-size:12px;white-space:nowrap}
.chip:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.agents{display:flex;gap:2px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px;font-size:12px}
.agent{min-height:28px;color:var(--dim);padding:0;font-size:12px}
.agent:hover{color:var(--ink)}
.agent[aria-checked="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:5px}
#agentDesc{color:var(--dim);font-size:12px}
.comp{border:0;border-top:1px solid var(--ink)}
.comp .row{display:flex;align-items:center;gap:10px;padding:0}
.comp .prompt{font-weight:600}
.comp input{flex:1;min-width:0;height:48px;border:0;background:transparent;outline:none;font-size:14.5px}
.comp input::placeholder{color:var(--dim);opacity:1}
.wakehint{color:var(--dim);font-size:12px;white-space:nowrap}
.tools{display:flex;gap:2px 16px;flex-wrap:wrap;align-items:baseline;padding:0 0 2px;border:0}
.tools .lbl{padding:0}
.tools .sep{display:none}
.tog{min-height:30px;padding:0;color:var(--dim);font-size:12.5px;display:inline-flex;gap:1ch}
.tog:hover{color:var(--ink)}
.tog::before{content:"[ ]"}
.tog[aria-pressed="true"]{color:var(--ink);font-weight:600}
.tog[aria-pressed="true"]::before{content:"[x]"}
.voice-open{margin-left:auto}
.keys{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;color:var(--dim);font-size:11.5px}
.keys kbd{font:inherit;margin-right:5px;color:var(--ink)}

/* two-pane */
.panes{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);padding:0 max(20px,calc((100vw - 100ch)/2))}
.list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.list-scroll{flex:1 1 0;min-height:0;overflow-y:auto;padding:0 18px 0 0}
.list .day{padding:16px 0 4px;color:var(--dim);font-size:12px}
.row-btn{display:flex;flex-direction:column;width:100%;padding:7px 0 7px 12px;min-height:50px;border-left:2px solid transparent;margin-left:-12px}
.row-btn:hover{border-left-color:var(--line)}
.row-btn[aria-pressed="true"]{border-left-color:var(--ink)}
.row-btn .t{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.row-btn .s{color:var(--dim);font-size:12px}
.badge{white-space:nowrap;color:var(--dim);font-size:12px;font-weight:400;text-transform:lowercase}
.badge.hot{color:var(--ink);font-weight:600}.badge.hot::before{content:"● "}
.detail-pane{min-width:0;min-height:0;overflow-y:auto;padding:0 0 32px 28px;display:flex;flex-direction:column;gap:20px}
.detail-pane .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.detail-pane h2{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.detail-pane .meta{color:var(--dim);font-size:12px}
.back{display:none;min-height:36px;color:var(--dim)}.back::before{content:"< "}
.tabs{display:flex;gap:18px;align-items:baseline;border-bottom:1px solid var(--line)}
.tabs button{min-height:36px;color:var(--dim);padding:0}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:8px}
.tabs .grow{flex:1}
.turns{display:flex;flex-direction:column;gap:16px;max-width:68ch}
.turns .u{font-weight:600}.turns .u::before{content:"> ";color:var(--dim);font-weight:400}
.turns .a .tl{color:var(--dim);font-size:12px}
.search{display:flex;align-items:baseline;gap:8px;color:var(--dim)}
.search::before{content:"/"}
.search input{border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;min-width:180px;height:30px;font-size:12.5px}
.search input:focus{border-bottom-color:var(--ink)}
.empty{padding:20px 0;color:var(--dim)}
.addrow{flex:none;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.field{height:34px;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0;outline:none;font-size:13px}
.field:focus{border-bottom-color:var(--ink)}
.field::placeholder{color:var(--dim);opacity:1}
.addrow .field{flex:1}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:flex;gap:12px;align-items:baseline;padding:4px 0}
.plan .pn{position:static;width:auto;height:auto;border:0;background:none;color:var(--dim)}
.plan .pn::before{content:"[ ]"}
.plan .done .pn::before{content:"[x]"}
.plan .now .pn::before{content:"[~]"}.plan .waiting .pn::before{content:"[?]"}.plan .stopped .pn::before{content:"[!]"}
.plan .done .pt{color:var(--dim)}.plan .pt{flex:1}
.plan .ps{color:var(--dim);font-size:12px;text-transform:lowercase}
.ask{border-left:1px solid var(--ink);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.ask p{font-weight:600;max-width:60ch}
.ask div{display:flex;gap:16px;flex-wrap:wrap}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto}
.col{max-width:calc(100ch + 40px);margin:0 auto;padding:6px 20px 48px;display:flex;flex-direction:column;gap:32px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.sect-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:4px;margin-bottom:4px}
.sect-h h2{font-size:13.5px;font-weight:600}.sect-h span{color:var(--dim);font-size:12px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:3px 0}
.kv span:first-child{color:var(--dim)}.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.ok-dot::before{content:"● ";color:var(--ok);font-size:10px}
.summary{display:flex;flex-direction:column;gap:8px}
.summary .lead{font-size:14.5px;font-weight:600;max-width:64ch}.summary .lead em{font-style:normal;text-decoration:underline;text-underline-offset:5px}
.summary p{color:var(--dim);max-width:64ch}
.fact{display:flex;align-items:baseline;gap:14px;padding:4px 0;flex-wrap:wrap}
.fact .tx{flex:1 1 30ch}.fact .wn{color:var(--dim);font-size:12px}
.fact .x{color:var(--dim);font-size:12px;min-height:28px}.fact .x:hover{color:var(--err);text-decoration:underline}
.refl p{max-width:64ch}.refl p+p{margin-top:10px}
.loops{display:flex;flex-direction:column;margin-top:14px}
.loops button{padding:5px 0;min-height:32px;display:flex;gap:10px}
.loops button::before{content:"→";color:var(--dim)}
.loops button:hover span:first-child{text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;flex-wrap:wrap;gap:2px 18px}
.seg button{min-height:34px;color:var(--dim);padding:0;display:inline-flex;gap:1ch}
.seg button::before{content:"( )"}
.seg button[aria-checked="true"]{color:var(--ink);font-weight:600}.seg button[aria-checked="true"]::before{content:"(•)"}
.hint{color:var(--dim);max-width:60ch}
.form{display:flex;flex-direction:column;gap:14px;max-width:60ch}
.form label{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:12px}
.form .field{width:100%;color:var(--ink);font-size:13.5px}
.formfoot{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.msg{color:var(--dim);font-size:12.5px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.pick{display:flex;flex-direction:column}
.pick button,.pick .vrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:32px;width:100%;padding:3px 0 3px 12px;margin-left:-12px;border-left:2px solid transparent}
.pick button:hover{border-left-color:var(--line)}
.pick [aria-pressed="true"],.pick .vrow.on{border-left-color:var(--ink)}
.pick .r{font-weight:600}.pick .m{color:var(--dim)}
.pick .assigned{color:var(--ink);font-size:12px}.pick .assigned::before{content:"● "}
.vrow{padding:0!important}
.vrow .vb{flex:1;min-height:32px;display:flex;align-items:baseline;gap:10px;padding:3px 0 3px 12px;border:0}
.vrow .vn{display:flex;gap:12px;align-items:baseline}.vrow .vn b{font-weight:600}.vrow .vn span{color:var(--dim);font-size:12px}
.radio{display:none}
.voice{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:64px 20px 28px;animation:fade .25s both}
.voice-top{position:absolute;top:14px;left:20px;right:20px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.voice-top .l{display:flex;gap:14px;align-items:baseline}.voice-top .l span{color:var(--dim);font-size:12px}
.voice canvas{width:min(60vw,300px);aspect-ratio:1;max-height:38vh}
.voice .word{font-size:20px;font-weight:600}
.voice .cap{color:var(--dim);max-width:60ch;text-align:center;min-height:2.8em}
.voice .prev{display:flex;gap:4px 16px;flex-wrap:wrap;justify-content:center;max-width:640px}
.voice .prev button{min-height:32px;color:var(--dim);padding:0}
.voice .prev button[aria-checked="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:5px}
.voice .note{color:var(--dim);font-size:11.5px;text-align:center}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:6px 12px;font-size:12.5px;animation:fade .2s both;max-width:90vw}

@media (max-width:900px){
  .panes{grid-template-columns:1fr;padding:0 20px}
  .panes .list{border-right:0}.panes .list-scroll{padding-right:0}
  .panes:not(.detail-open) .detail-pane{display:none}
  .panes.detail-open .list{display:none}
  .back{display:inline-flex}
  .detail-pane{padding-left:0}
}
@media (max-width:640px){
  .rail{gap:4px 14px}
  .rail-foot{margin-left:0;width:100%}
  .nav{gap:0 14px}
  .strip{width:100%}
  .keys,.tries .lbl,#agentDesc{display:none}
  .top .sub{margin-left:0;width:100%}
}
@media (max-height:760px){.keys{display:none}}
</style>
</head>
<body>
<div id="app">
  <aside class="rail" aria-label="Primary">
    <div class="logo" aria-label="hi">hi</div>
    <div class="sys" id="sys" role="status" aria-live="polite"><span class="dot"></span><span id="sysWord">ready</span></div>
    <nav class="nav" id="nav" aria-label="Views"></nav>
    <div class="rail-foot">
      <button class="theme-btn" id="themeBtn" data-act="theme" aria-label="Theme: auto. Activate to change.">auto</button>
      <span class="model" id="railModel"></span>
    </div>
  </aside>
  <main class="stage" id="stage"></main>

  <section class="voice" id="voice" role="dialog" aria-modal="true" aria-label="Voice mode" hidden>
    <div class="voice-top">
      <div class="l"><span style="font:600 14px var(--mono);color:var(--ink)">hi</span><span id="voiceMeta"></span></div>
      <button class="btn quiet" id="voiceClose" data-act="closeVoice">Leave voice mode (esc)</button>
    </div>
    <canvas id="orb" role="img" aria-label="Animated voice orb"></canvas>
    <div class="word" id="voiceWord" role="status">listening</div>
    <p class="cap" id="voiceCap"></p>
    <div class="prev" id="voicePrev" role="radiogroup" aria-label="Preview a state"></div>
    <div class="note">Preview a state to see the orb change. In use, it follows the live state.</div>
  </section>

    const n = Math.sin(a * 3 + t * cfg.spd) * .5 + Math.sin(a * 7 - t * cfg.spd * 1.7) * .3 + Math.sin(a * 11 + t * cfg.spd * .6) * .2;
    let len = R * .04 + R * .3 * cfg.amp * (.5 + .5 * n);
    if (cfg.spin) len = (i % 6 < 3) ? R * .11 : R * .03;
    c.strokeStyle = (cfg.spin && i % 6 >= 3) ? line : acc; c.lineWidth = Math.max(2, R * .018);
    c.beginPath(); c.moveTo(cx + Math.cos(a) * base * 1.12, cy + Math.sin(a) * base * 1.12); c.lineTo(cx + Math.cos(a) * (base * 1.12 + len), cy + Math.sin(a) * (base * 1.12 + len)); c.stroke();
  }
  c.fillStyle = acc; c.beginPath(); c.arc(cx, cy, base * breathe, 0, Math.PI * 2); c.fill();
  c.fillStyle = ink; c.globalAlpha = .9; c.beginPath(); c.arc(cx, cy, base * .22, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
  if (cfg.orbit) { const a = t * 2.4; c.fillStyle = ink; c.fillRect(cx + Math.cos(a) * base * .62 - 4, cy + Math.sin(a) * base * .62 - 4, 8, 8); }
}
function orbLoop(ms) {
  drawOrb(ms / 1000);
  if (S.voiceOpen && !matchMedia('(prefers-reduced-motion: reduce)').matches) orbRAF = requestAnimationFrame(orbLoop);
}
function openVoice() {
  orbOpener = document.activeElement; S.voiceOpen = true; render();
  cancelAnimationFrame(orbRAF); orbRAF = requestAnimationFrame(orbLoop); $('#voiceClose').focus();
}
function closeVoice() {
  S.voiceOpen = false; S.voicePrev = null; cancelAnimationFrame(orbRAF); render();
  if (orbOpener && document.contains(orbOpener)) orbOpener.focus(); else { const m = $('#msg'); if (m) m.focus(); }
}

/* ---------- events ---------- */
const ACTS = {
  nav: (el) => setState({ view: el.dataset.id, pane: false }),
  theme: () => {
    const next = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; S.theme = next;
    if (next === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', next);
    const b = $('#themeBtn'); b.textContent = next; b.setAttribute('aria-label', `Theme: ${next}. Activate to change.`);
    if (S.voiceOpen) drawOrb(performance.now() / 1000);
  },
  step: (el) => {
    const id = el.dataset.id; S.open[id] = !S.open[id];
    const li = el.closest('.step'); li.classList.toggle('open', !!S.open[id]); el.setAttribute('aria-expanded', String(!!S.open[id]));
  },
  zoom: (el) => { S.zoom[el.dataset.id] = !S.zoom[el.dataset.id]; renderFeed(); },
  copy: (el) => copyText(el.dataset.text),
  try: (el) => { S.input = el.dataset.text; const i = $('#msg'); i.value = S.input; i.focus(); },
  persona: (el) => setState({ persona: el.dataset.id }),
  tog: (el) => {
    const k = el.dataset.k, on = !S[k]; S[k] = on;
    if (k === 'mic' && on) {
      later(2200, () => {
        if (!S.mic) return;
        if (S.tidy) { S.mic = false; setState({ sys: 'structuring' }); later(700, () => { S.input = S.input || 'make logic_play private'; setState({ sys: 'ready' }); }); }
        else setState({ mic: false, input: S.input || 'make logic_play private' });
      });
    }
    render();
  },
  yes: () => resolve(true), no: () => resolve(false),
  openVoice, closeVoice,
  vprev: (el) => { S.voicePrev = S.voicePrev === el.dataset.id ? null : el.dataset.id; render(); },
  hist: (el) => setState({ histSel: el.dataset.id, pane: true }),
  histTab: (el) => setState({ histRaw: el.dataset.id === 'm' }),
  paneBack: () => setState({ pane: false }),
  reopen: () => {
    const ht = THREADS.find((t) => t.id === S.histSel) || THREADS[0];
    setState({ view: 'chat', title: ht.title, pane: false, messages: [{ id: 'r0' + Date.now(), kind: 'user', at: ht.time, text: ht.turns[0][1] }, { id: 'r1' + Date.now(), kind: 'agent', persona: ht.persona, tier: 'SONNET', dur: '', steps: [], chart: false, photo: false, file: '', quotes: [], text: ht.turns[1][1] }] });
  },
  task: (el) => setState({ taskSel: el.dataset.id, pane: true }),
  goTask: (el) => setState({ view: 'tasks', taskSel: el.dataset.id, pane: true }),
  answer: (el) => {
    const label = el.dataset.text;
    S.tasks.ag = S.tasks.ag.map((x) => (x.id === el.dataset.id ? { ...x, status: 'running', sub: 'step 3 of 5 · you chose: ' + label, at: 2 } : x)); render();
  },
  stop: () => {
    const id = S.taskSel;
    S.tasks.bg = S.tasks.bg.map((x) => (x.id === id ? { ...x, status: 'stopped', sub: 'stopped by you' } : x));
    S.tasks.ag = S.tasks.ag.map((x) => (x.id === id ? { ...x, status: 'stopped', sub: 'stopped by you' } : x)); render();
  },
  forget: (el) => setState({ facts: S.facts.filter((f) => f.id !== el.dataset.id) }),
  refresh: () => {
    setState({ refreshing: true });
    later(700, () => setState({ refreshing: false, statTime: new Date().toLocaleTimeString('en-GB') }));
  },
  stab: (el) => setState({ stab: el.dataset.id, settingsMsg: '', settingsErr: false }),
  mode: (el) => { const m = MODES.find((x) => x[0] === el.dataset.id); setState({ mode: m[0], endpoint: m[3], settingsMsg: '', settingsErr: false }); },
  role: (el) => setState({ role: el.dataset.id }),
  assign: (el) => setState({ roles: { ...S.roles, [S.role]: el.dataset.id } }),
  voice: (el) => setState({ voice: el.dataset.id }),
  preview: (el) => {
    const name = el.dataset.id;
    try {
      const ss = window.speechSynthesis; if (!ss) throw new Error('none');
      ss.cancel(); const u = new SpeechSynthesisUtterance(`Hi, I'm ${name}. This is how I sound.`);
      const v = ss.getVoices().find((x) => x.name.includes(name)); if (v) u.voice = v; ss.speak(u);
      toast(v ? `Playing ${name}.` : `${name} isn't installed here. Playing the default voice.`);
    } catch (e) { toast('Speech playback isn’t available in this view.'); }
  },
  test: () => validateConn(false), save: () => validateConn(true)
};
function validateConn(save) {
  if (!/^https?:\/\/\S+$/.test(S.endpoint.trim())) return setState({ settingsErr: true, settingsMsg: 'Endpoint must start with http:// or https://' });
  if (S.mode === 'openrouter' && !S.apiKey.trim()) return setState({ settingsErr: true, settingsMsg: 'OpenRouter needs an API key. Paste one above.' });
  if (save) return setState({ settingsErr: false, settingsMsg: `Saved. Using ${S.mode} mode.` });
  setState({ settingsErr: false, settingsMsg: 'Testing…' });
  later(700, () => setState({ settingsMsg: 'Connected. Model list loaded (8 models).' }));
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTS[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'send') send();
  if (k === 'addAgent') {
    const t = S.newAgent.trim(); if (!t) return;
    const id = 'a' + Date.now();
    setState({ newAgent: '', taskSel: id, pane: true, tasks: { ...S.tasks, ag: [...S.tasks.ag, { id, name: t, status: 'queued', sub: 'starting…', plan: ['Plan', 'Execute', 'Report'], at: 0 }] } });
    later(1200, () => { S.tasks.ag = S.tasks.ag.map((x) => (x.id === id ? { ...x, status: 'running', sub: 'step 1 of 3' } : x)); render(); });
  }
  if (k === 'addFact') {
    const t = S.newFact.trim(); if (!t) return;
    setState({ newFact: '', facts: [{ id: 'f' + Date.now(), text: t, when: new Date().toISOString().slice(0, 10) }, ...S.facts] });
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'msg') { S.input = el.value; return; }
  const k = el.dataset && el.dataset.bind; if (!k) return;
  S[k] = el.value;
  if (['histQ', 'modelFilter'].includes(k)) render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.voiceOpen) { closeVoice(); return; }
  if (e.key === 'Tab' && S.voiceOpen) { // keep focus inside the voice dialog
    const f = $$('#voice button'); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  const el = e.target;
  if (el.id !== 'msg') {
    if (S.confirm && S.view === 'chat' && !/INPUT|TEXTAREA/.test(el.tagName) && (e.key === 'y' || e.key === 'n')) resolve(e.key === 'y');
    return;
  }
  if (e.key === 'ArrowUp') { e.preventDefault(); const n = S.sent.length; if (!n) return; recall = recall < 0 ? n - 1 : Math.max(0, recall - 1); S.input = S.sent[recall]; el.value = S.input; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (recall < 0) return; recall += 1; if (recall >= S.sent.length) { recall = -1; S.input = ''; } else S.input = S.sent[recall]; el.value = S.input; }
  else if ((e.key === 'y' || e.key === 'n') && S.confirm && !S.input) { e.preventDefault(); resolve(e.key === 'y'); }
});
window.addEventListener('resize', () => { if (S.voiceOpen) drawOrb(performance.now() / 1000); });
window.addEventListener('beforeunload', () => timers.forEach(clearTimeout));

render();
</script>
