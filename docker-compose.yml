# `docker compose up --build` starts everything; open http://localhost:5176
#
# Optional settings go in a `.env` file next to this one:
#   HI_VAULT=/path/to/your/obsidian/vault   (`hi` sets this from VAULT_PATH in ~/.hi/.env;
#                                            without it the stack uses an empty Docker volume)
#   AI_MODE=local|tailscale   (also switchable in the UI's settings view)
#   OLLAMA_HOST=http://host.docker.internal:11434
#   TAILSCALE_OLLAMA_URL=http://my-desktop:11434
#   GITHUB_PERSONAL_ACCESS_TOKEN=ghp_...   (`hi` copies it from ~/.hi/.env for you)
#   HI_WEB_PORT=5176
#   HI_HOST_ROOT=C:/Users/your-name   (your home folder; `hi` sets it, else USERPROFILE/HOME is used)
# Your Dev, Documents, Desktop and Downloads folders appear in the container under /host on every OS.
services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8768:8768" # loopback only on the host
    environment:
      AI_MODE: ${AI_MODE:-local}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      TAILSCALE_OLLAMA_URL: ${TAILSCALE_OLLAMA_URL:-}
      VAULT_PATH: /vault
      USER_ADDRESS: ${USER_ADDRESS:-sir}            # how replies and speech address you ("" = off)
      MEMORY_EXTRACTION: ${MEMORY_EXTRACTION:-on}   # off = stop learning from turns
      REFLECTION: ${REFLECTION:-on}                 # off = no daily reflection
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      SANDBOX_URL: http://host.docker.internal:8003 # the sandbox's loopback-published port
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_MCP_URL: http://google:8777/mcp
      N8N_MCP_URL: ${N8N_MCP_URL:-}
      N8N_MCP_TOKEN: ${N8N_MCP_TOKEN:-}
      TTS_BACKEND: ${TTS_BACKEND:-ollama}           # huggingface = the GPU `tts` service below
      TTS_URL: http://tts:8783
      WHISPER_CPP_URL: ${WHISPER_CPP_URL:-http://whisper:8083} # the `whisper` service below
      SEARXNG_URL: http://searxng:8083              # the `searxng` service below
      IMAGE_URL: ${IMAGE_URL:-}                      # image generation: blank = the tailscale box in tailscale mode, else the service below
      IMAGE_URL_DEFAULT: http://imagegen:8793       # the `imagegen` service below (profile gpu)
      TZ: ${TZ:-UTC}                                # schedules fire in this zone; `hi` sets it from your Mac
      HI_LAUNCH_CWD: ${HI_LAUNCH_CWD:-/host/Dev/Projects} # where shell commands start
      HI_HOST_HOME: /host
      GIT_CONFIG_GLOBAL: /host/.gitconfig
      HI_CORS_ORIGINS: http://localhost:${HI_WEB_PORT:-5176},http://127.0.0.1:${HI_WEB_PORT:-5176}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: # Docker restarts a backend that is up but no longer answering (restart: unless-stopped)
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8768/livez', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    volumes:
      - ${HI_VAULT:-hi-vault}:/vault # HI_VAULT uses forward slashes (C:/Users/...); `hi` writes it that way
      - hi-home:/root/.hi # settings saved from the UI persist here
      # Long form, so Windows drive letters (C:/...) are not mistaken for the source:target colon.
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Dev
        target: /host/Dev
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Documents
        target: /host/Documents
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Desktop
        target: /host/Desktop
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Downloads
        target: /host/Downloads
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/.gitconfig
        target: /host/.gitconfig
        read_only: true
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/.hi/.env
        target: /run/hi-host.env
        read_only: true

  # Google Workspace MCP, kept running: its sign-in callback (localhost:8777) must stay up while
  # you approve access in the browser, which a per-call subprocess cannot do. The login token
  # lives in the hi-google volume.
  google:
    build: .
    restart: unless-stopped
    command: ["sh", "/google-mcp.sh"] # reads the OAuth client from ~/.hi/.env, mounted below
    ports:
      - "127.0.0.1:8777:8777"
    environment:
      WORKSPACE_MCP_PORT: "8777"
      WORKSPACE_MCP_HOST: 0.0.0.0 # inside its container; published to this machine only
      WORKSPACE_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,google
      WORKSPACE_MCP_BASE_URI: http://localhost
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      GOOGLE_MCP_CREDENTIALS_DIR: /creds
    volumes:
      - hi-google:/creds
      - ./google-mcp.sh:/google-mcp.sh:ro
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/.hi/.env
        target: /run/hi-host.env
        read_only: true

  # Optional GPU voice for machines where Ollama's phonon has no CUDA build (needs an NVIDIA GPU and
  # the NVIDIA container toolkit). `docker compose --profile gpu up -d --build tts`, then set
  # TTS_BACKEND=huggingface (Settings > voice, or ~/.hi/.env). Needs HF_TOKEN in ~/.hi/.env and the
  # gradium/phonon-40m-en terms accepted on Hugging Face. Weights cache in hi-tts-models.
  tts:
    build: ./tts
    profiles: [gpu]
    environment:
      HF_TOKEN: ${HF_TOKEN:-} # `hi` forwards it from ~/.hi/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8783:8783"
    volumes:
      - hi-tts-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Image generation for the agent (hi/imagegen.py): Z-Image-Turbo by default (Apache-2.0, fits 16 GB), or set
  # IMAGE_MODEL=black-forest-labs/FLUX.2-klein-4B. Needs an NVIDIA GPU and the NVIDIA container toolkit:
  # `docker compose --profile gpu up -d --build imagegen`. The first request downloads the weights (about 12 GB) into
  # hi-image-models and loads them, which takes minutes. On a Mac run `python imagegen/server.py` natively instead
  # (Apple GPU) and set IMAGE_URL=http://host.docker.internal:8793. In AI_MODE=tailscale, run this service on the
  # tailscale box instead: hi then calls http://<that host>:8793 on its own (set IMAGE_API_KEY on both sides).
  imagegen:
    build: ./imagegen
    profiles: [gpu]
    environment:
      IMAGE_MODEL: ${IMAGE_MODEL:-Tongyi-MAI/Z-Image-Turbo}
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8793:8793"
    volumes:
      - hi-image-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Speech-to-text: whisper.cpp's `whisper-server` on CPU (hi/stt.py). The model (WHISPER_MODEL,
  # default base.en) downloads on first start into hi-whisper-models. For Metal speed on a Mac, run
  # `whisper-server` natively instead and set WHISPER_CPP_URL=http://host.docker.internal:8083.
  whisper:
    build: ./whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - hi-whisper-models:/models

  # Web search for the agent (hi/agents/web/search.py): a private SearXNG that only the backend reaches, on the
  # compose network (nothing published). Natively (`hi --voice-daemon`) publish it with a docker-compose.override.yml
  # (ports: ["127.0.0.1:8891:8083"]) and the backend's default SEARXNG_URL finds it. Tag is pinned on purpose:
  # bump it deliberately, never `latest`.
  searxng:
    image: searxng/searxng:2026.11.15-2d500cb6b
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-} # `hi` creates one in ~/.hi/.env on first start
      SEARXNG_BASE_URL: http://searxng:8083/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  # Runs the Python the agent writes (charts, ML). It has outbound internet and nothing
  # else: it sits alone on its own network, so the code in it cannot reach the backend's
  # (unauthenticated) API. The backend calls it through a loopback-only published port.
  # No capabilities, read-only filesystem, CPU/memory/process limits.
  sandbox:
    build: ./sandbox
    restart: unless-stopped
    networks: [egress]
    extra_hosts:
      - "host.docker.internal:0.0.0.0" # not a way back to the host by name
    ports:
      - "127.0.0.1:8003:8003"
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  web:
    build: ./tinyui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HI_WEB_PORT:-5176}:80"
    depends_on:
      - backend

networks:
  egress: {} # the sandbox's own network: internet, but no route to the backend

volumes:
  hi-vault:
  hi-home:
  hi-google:
  hi-tts-models:
  hi-image-models:
  hi-whisper-models:
