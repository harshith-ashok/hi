# `docker compose up --build` starts everything; open http://localhost:5173
#
# Optional settings go in a `.env` file next to this one:
#   HI_VAULT=/path/to/your/obsidian/vault   (`hi` sets this from VAULT_PATH in ~/.hi/.env;
#                                            without it the stack uses an empty Docker volume)
#   AI_MODE=local|tailscale|openrouter   (also switchable in the UI's settings view)
#   OLLAMA_HOST=http://host.docker.internal:11434
#   TAILSCALE_OLLAMA_URL=http://my-desktop:11434
#   OPENROUTER_API_KEY=sk-or-...
#   GITHUB_PERSONAL_ACCESS_TOKEN=ghp_...   (`hi` copies it from ~/.hi/.env for you)
#   HI_WEB_PORT=5173
#   HI_HOST_ROOT=C:/Users/your-name   (your home folder; `hi` sets it, else USERPROFILE/HOME is used)
# Your Dev, Documents, Desktop and Downloads folders appear in the container under /host on every OS.
services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765" # loopback only on the host
    environment:
      AI_MODE: ${AI_MODE:-local}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      TAILSCALE_OLLAMA_URL: ${TAILSCALE_OLLAMA_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VAULT_PATH: /vault
      USER_ADDRESS: ${USER_ADDRESS:-sir}            # how replies and speech address you ("" = off)
      MEMORY_EXTRACTION: ${MEMORY_EXTRACTION:-on}   # off = stop learning from turns
      REFLECTION: ${REFLECTION:-on}                 # off = no daily reflection
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      SANDBOX_URL: http://host.docker.internal:8000 # the sandbox's loopback-published port
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_MCP_URL: http://google:8777/mcp
      N8N_MCP_URL: ${N8N_MCP_URL:-}
      N8N_MCP_TOKEN: ${N8N_MCP_TOKEN:-}
      TTS_BACKEND: ${TTS_BACKEND:-ollama}           # huggingface = the GPU `tts` service below
      TTS_URL: http://tts:8780
      WHISPER_CPP_URL: ${WHISPER_CPP_URL:-http://host.docker.internal:8080}
      HI_LAUNCH_CWD: ${HI_LAUNCH_CWD:-/host/Dev/Projects} # where shell commands start
      HI_HOST_HOME: /host
      GIT_CONFIG_GLOBAL: /host/.gitconfig
      HI_CORS_ORIGINS: http://localhost:${HI_WEB_PORT:-5173},http://127.0.0.1:${HI_WEB_PORT:-5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HI_VAULT:-hi-vault}:/vault # HI_VAULT uses forward slashes (C:/Users/...); `hi` writes it that way
      - hi-home:/root/.hi # settings saved from the UI persist here
      # Long form, so Windows drive letters (C:/...) are not mistaken for the source:target colon.
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Dev
        target: /host/Dev
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Documents
        target: /host/Documents
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Desktop
        target: /host/Desktop
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/Downloads
        target: /host/Downloads
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/.gitconfig
        target: /host/.gitconfig
        read_only: true
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/.hi/.env
        target: /run/hi-host.env
        read_only: true

  # Google Workspace MCP, kept running: its sign-in callback (localhost:8777) must stay up while
  # you approve access in the browser, which a per-call subprocess cannot do. The login token
  # lives in the hi-google volume.
  google:
    build: .
    restart: unless-stopped
    command: ["sh", "/google-mcp.sh"] # reads the OAuth client from ~/.hi/.env, mounted below
    ports:
      - "127.0.0.1:8777:8777"
    environment:
      WORKSPACE_MCP_PORT: "8777"
      WORKSPACE_MCP_HOST: 0.0.0.0 # inside its container; published to this machine only
      WORKSPACE_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,google
      WORKSPACE_MCP_BASE_URI: http://localhost
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      GOOGLE_MCP_CREDENTIALS_DIR: /creds
    volumes:
      - hi-google:/creds
      - ./google-mcp.sh:/google-mcp.sh:ro
      - type: bind
        source: ${HI_HOST_ROOT:-${USERPROFILE:-${HOME}}}/.hi/.env
        target: /run/hi-host.env
        read_only: true

  # Optional GPU voice for machines where Ollama's phonon has no CUDA build (needs an NVIDIA GPU and
  # the NVIDIA container toolkit). `docker compose --profile gpu up -d --build tts`, then set
  # TTS_BACKEND=huggingface (Settings > voice, or ~/.hi/.env). Needs HF_TOKEN in ~/.hi/.env and the
  # gradium/phonon-40m-en terms accepted on Hugging Face. Weights cache in hi-tts-models.
  tts:
    build: ./tts
    profiles: [gpu]
    environment:
      HF_TOKEN: ${HF_TOKEN:-} # `hi` forwards it from ~/.hi/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - hi-tts-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Runs the Python the agent writes (charts, ML). It has outbound internet and nothing
  # else: it sits alone on its own network, so the code in it cannot reach the backend's
  # (unauthenticated) API. The backend calls it through a loopback-only published port.
  # No capabilities, read-only filesystem, CPU/memory/process limits.
  sandbox:
    build: ./sandbox
    restart: unless-stopped
    networks: [egress]
    extra_hosts:
      - "host.docker.internal:0.0.0.0" # not a way back to the host by name
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  web:
    build: ./tinyui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HI_WEB_PORT:-5173}:80"
    depends_on:
      - backend

networks:
  egress: {} # the sandbox's own network: internet, but no route to the backend

volumes:
  hi-vault:
  hi-home:
  hi-google:
  hi-tts-models:
