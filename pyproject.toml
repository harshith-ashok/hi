[project]
name = "hi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ag-ui-protocol>=0.1.22",
    "croniter>=7.0.0",
    "deepagents>=0.6.12",
    "faster-whisper>=1.2.1", # transcribes dropped audio files, also inside the Docker image
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "psutil>=7.2.2",
    "pypdf>=7.0.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.0",
]

# Voice + macOS-only extras. Installed by default (`uv sync`), skipped in the
# Docker image with `--no-group desktop` (Linux, no audio/screen access).
[dependency-groups]
desktop = [
    "openwakeword>=0.4.0",
    "pynput>=1.7.7",
    "pyobjc-framework-vision>=12.2",
    "sounddevice>=0.5.5",
]
dev = [
    "pytest>=8",
]

[tool.uv]
default-groups = ["desktop", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:langchain_core.*"]

[project.scripts]
hi = "hi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hi"]
