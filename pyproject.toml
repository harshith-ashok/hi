[project]
name = "hi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ag-ui-protocol>=0.1.22",
    "deepagents>=0.6.12",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "openwakeword>=0.4.0",
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2.2",
    "pynput>=1.7.7",
    "pyobjc-framework-vision>=12.2",
    "sounddevice>=0.5.5",
]

[project.scripts]
hi = "hi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hi"]
